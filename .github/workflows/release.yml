name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --configuration Release

      - name: Extract release notes
        run: |
          $version = $env:TAG.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## $([regex]::Escape($version)) [^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)"
          if ($changelog -notmatch $pattern) {
            throw "CHANGELOG.md has no entry for $version"
          }
          $Matches['notes'].Trim() | Set-Content release-notes.md

      - name: Publish
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish ScreenMark/ScreenMark.csproj `
            --configuration Release `
            --runtime win-x64 `
            --no-self-contained `
            --output publish `
            -p:Version=$version
          Compress-Archive -Path publish/* -DestinationPath "ScreenMark-$env:TAG-win-x64.zip"

      - name: Create release
        run: >
          gh release create $env:TAG "ScreenMark-$env:TAG-win-x64.zip"
          --title "ScreenMark $($env:TAG.TrimStart('v'))"
          --notes-file release-notes.md
          --verify-tag
